<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="VoteChain — Hybrid Blockchain Voting System Banner">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#9333ea" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.65" />
    </linearGradient>
    <linearGradient id="emblemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    <radialGradient id="indigoOrb" cx="22%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.26" />
      <stop offset="65%" stop-color="#4f46e5" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleOrb" cx="82%" cy="74%" r="40%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.24" />
      <stop offset="60%" stop-color="#7e22ce" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="emeraldOrb" cx="76%" cy="20%" r="30%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Main Canvas Card -->
  <rect x="4" y="4" width="1192" height="352" rx="26" fill="url(#bannerBg)" stroke="url(#borderGrad)" stroke-width="2" />
  <rect x="4" y="4" width="1192" height="352" rx="26" fill="url(#dotGrid)" />

  <!-- Ambient Glows -->
  <rect x="4" y="4" width="1192" height="352" rx="26" fill="url(#indigoOrb)" />
  <rect x="4" y="4" width="1192" height="352" rx="26" fill="url(#purpleOrb)" />
  <rect x="4" y="4" width="1192" height="352" rx="26" fill="url(#emeraldOrb)" />

  <!-- Top Left Badge Pill -->
  <rect x="56" y="42" width="268" height="28" rx="14" fill="#1e1b4b" fill-opacity="0.75" stroke="#4f46e5" stroke-opacity="0.55" stroke-width="1" />
  <circle cx="76" cy="56" r="4.5" fill="#34d399" />
  <text x="90" y="60" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.3" fill="#c7d2fe">HYBRID ON-CHAIN GOVERNANCE</text>

  <!-- Brand Emblem Icon (Left of Title) -->
  <g transform="translate(56, 94)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="url(#emblemGrad)" />
    <polygon points="38,14 59,26 59,50 38,62 17,50 17,26" fill="#090d16" fill-opacity="0.92" stroke="#e0e7ff" stroke-width="2" stroke-linejoin="round" />
    <path d="M29 38 L36 45 L48 31" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Main Wordmark Title -->
  <text x="150" y="150" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-1">
    <tspan fill="#f8fafc">Vote</tspan><tspan fill="#818cf8">Chain</tspan>
  </text>

  <!-- Subtitle & Tech Line -->
  <text x="56" y="206" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" fill="#e2e8f0">
    Cryptographically Verifiable, Zero-Gas Blockchain Voting
  </text>
  <text x="56" y="236" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8">
    Solidity (^0.8.20)  •  Express Web3 Relayer  •  MongoDB Audit Trail  •  React 18 + Vite
  </text>

  <!-- Feature Pills (Vector Icons Only) -->
  <g transform="translate(56, 268)">
    <!-- Pill 1: Gasless Relayer -->
    <rect x="0" y="0" width="194" height="36" rx="11" fill="#1e1b4b" fill-opacity="0.7" stroke="#6366f1" stroke-opacity="0.55" stroke-width="1" />
    <path d="M21 10 L14 19 L20 19 L17 26 L26 17 L20 17 Z" fill="#818cf8" />
    <text x="34" y="22.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#e0e7ff">1-Click Gasless Voting</text>

    <!-- Pill 2: Direct MetaMask -->
    <rect x="208" y="0" width="194" height="36" rx="11" fill="#2e1065" fill-opacity="0.55" stroke="#9333ea" stroke-opacity="0.55" stroke-width="1" />
    <polygon points="227,10 235,14.5 235,23.5 227,28 219,23.5 219,14.5" fill="none" stroke="#c084fc" stroke-width="2" />
    <text x="244" y="22.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#f3e8ff">Direct MetaMask Web3</text>

    <!-- Pill 3: Anonymized Receipts -->
    <rect x="416" y="0" width="210" height="36" rx="11" fill="#064e3b" fill-opacity="0.45" stroke="#10b981" stroke-opacity="0.55" stroke-width="1" />
    <path d="M435 10 L443 13.5 V19.5 C443 24 439.5 27 435 28.5 C430.5 27 427 24 427 19.5 V13.5 Z" fill="none" stroke="#34d399" stroke-width="1.8" />
    <path d="M431.5 19 L434 21.5 L439 16" fill="none" stroke="#34d399" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="452" y="22.5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#d1fae5">Anonymized Tx Receipts</text>
  </g>

  <!-- Right Side Visual Card: On-Chain Governance Pipeline -->
  <g transform="translate(744, 38)">
    <rect x="0" y="0" width="400" height="284" rx="20" fill="#0b1120" fill-opacity="0.92" stroke="#334155" stroke-width="1.5" />

    <!-- Card Header Bar -->
    <path d="M0 20 Q0 0 20 0 H380 Q400 0 400 20 V40 H0 Z" fill="#0f172a" />
    <line x1="0" y1="40" x2="400" y2="40" stroke="#1e293b" stroke-width="1" />
    <circle cx="22" cy="20" r="5" fill="#f43f5e" />
    <circle cx="40" cy="20" r="5" fill="#f59e0b" />
    <circle cx="58" cy="20" r="5" fill="#10b981" />
    <text x="380" y="24" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#94a3b8">Voting.sol  •  ChainId 31337</text>

    <!-- Step 1: Voter Nullifier -->
    <rect x="20" y="56" width="360" height="58" rx="12" fill="#090d16" stroke="#1e293b" stroke-width="1.2" />
    <rect x="32" y="72" width="76" height="24" rx="6" fill="#064e3b" fill-opacity="0.65" stroke="#10b981" stroke-opacity="0.5" />
    <text x="70" y="88" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10.5" font-weight="700" fill="#34d399">IDENTITY</text>
    <text x="122" y="81" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e2e8f0">keccak256(ID + salt)</text>
    <text x="122" y="99" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#64748b">Salted bytes32 nullifier (zero plaintext ID)</text>

    <!-- Connector 1 -> 2 -->
    <line x1="200" y1="114" x2="200" y2="128" stroke="#6366f1" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Step 2: Relayer / Smart Contract -->
    <rect x="20" y="128" width="360" height="58" rx="12" fill="#090d16" stroke="#4f46e5" stroke-opacity="0.55" stroke-width="1.2" />
    <rect x="32" y="144" width="76" height="24" rx="6" fill="#1e1b4b" fill-opacity="0.85" stroke="#6366f1" stroke-opacity="0.6" />
    <text x="70" y="160" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10.5" font-weight="700" fill="#a5b4fc">RELAYER</text>
    <text x="122" y="153" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e2e8f0">castRelayerVote(eid, cid, hash)</text>
    <text x="122" y="171" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#64748b">Mutex-serialized nonce &amp; gas sponsorship</text>

    <!-- Connector 2 -> 3 -->
    <line x1="200" y1="186" x2="200" y2="200" stroke="#10b981" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Step 3: Confirmed Receipt -->
    <rect x="20" y="200" width="360" height="62" rx="12" fill="#090d16" stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2" />
    <rect x="32" y="218" width="76" height="24" rx="6" fill="#451a03" fill-opacity="0.7" stroke="#f59e0b" stroke-opacity="0.55" />
    <text x="70" y="234" text-anchor="middle" font-family="ui-sans-serif, sans-serif" font-size="10.5" font-weight="700" fill="#fbbf24">RECEIPT</text>
    <text x="122" y="226" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#34d399">txHash Verified • Block Sealed</text>
    <text x="122" y="244" font-family="ui-sans-serif, sans-serif" font-size="11" fill="#64748b">Public inclusion check; choice stays hidden</text>
  </g>
</svg>
